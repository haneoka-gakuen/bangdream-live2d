name: Sync live2d branch to Cloudflare R2

on:
  push:
    branches: ["live2d"]
  workflow_run:
    workflows: ["Auto Update Live2D Assets"]
    types: [completed]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/live2d') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'live2d')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: live2d
          fetch-depth: 0
      
      - name: Install AWS CLI
        run: |
          curl "https://s3.amazonaws.com/aws-cli/awscli-bundle.zip" -o "awscli-bundle.zip"
          unzip awscli-bundle.zip
          sudo ./awscli-bundle/install -i /usr/local/aws -b /usr/local/bin/aws

      - name: Configure AWS creds for R2
        run: |
          aws configure set aws_access_key_id      "$R2_ACCESS_KEY_ID"
          aws configure set aws_secret_access_key  "$R2_SECRET_ACCESS_KEY"
        env:
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Upload changed files to R2
        env:
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET:   ${{ secrets.R2_BUCKET }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Using endpoint: $R2_ENDPOINT"
          STATE_KEY="live2d/.sync-state/last_synced_sha.txt"
          STATE_FILE="$(mktemp)"
          ROOT_SYNC_DIRS=(data stamp changedstamp bilibili)
          EXCLUDED_PATTERNS=(
            ".git/*"
            ".github/*"
            ".gitignore"
            "awscli-bundle.zip"
            "awscli-bundle/*"
            "node_modules/*"
            "README.md"
            "requirements.txt"
            "scripts/*"
          )

          matches_any_pattern() {
            local value="$1"
            shift
            local pattern
            for pattern in "$@"; do
              case "$value" in
                $pattern)
                  return 0
                  ;;
              esac
            done
            return 1
          }

          should_sync_path() {
            local p="$1"
            if matches_any_pattern "$p" "${EXCLUDED_PATTERNS[@]}"; then
              return 1
            fi
            return 0
          }

          is_root_synced_path() {
            local p="$1"
            local dir
            for dir in "${ROOT_SYNC_DIRS[@]}"; do
              case "$p" in
                "$dir"/*)
                  return 0
                  ;;
              esac
            done
            return 1
          }

          s3_key_for_path() {
            local p="$1"
            if is_root_synced_path "$p"; then
              printf '%s\n' "$p"
            else
              printf 'live2d/%s\n' "$p"
            fi
          }

          sync_root_directory() {
            local dir="$1"
            if [[ -d "$dir" ]]; then
              echo "Sync root directory: $dir/"
              aws s3 sync "$dir" "s3://${R2_BUCKET}/${dir}/" \
                --endpoint-url "$R2_ENDPOINT" \
                --delete
            else
              echo "Local directory missing, removing remote root directory: $dir/"
              aws s3 rm "s3://${R2_BUCKET}/${dir}/" \
                --recursive \
                --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1 || true
            fi
          }

          sync_live2d_prefix() {
            local args=(. "s3://${R2_BUCKET}/live2d/" --endpoint-url "$R2_ENDPOINT")
            local pattern
            local dir

            for pattern in "${EXCLUDED_PATTERNS[@]}"; do
              args+=(--exclude "$pattern")
            done

            for dir in "${ROOT_SYNC_DIRS[@]}"; do
              args+=(--exclude "${dir}/*")
            done

            args+=(--delete)
            aws s3 sync "${args[@]}"
          }

          sync_root_directories() {
            local dir
            for dir in "${ROOT_SYNC_DIRS[@]}"; do
              sync_root_directory "$dir"
            done
          }

          if [[ "$EVENT_NAME" == "push" ]]; then
            AFTER="$PUSH_AFTER"
          elif [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # workflow_run.head_sha is the commit that started the upstream
            # workflow, not the commit it may have pushed before finishing.
            AFTER="$(git rev-parse HEAD)"
          else
            AFTER="$(git rev-parse HEAD)"
          fi

          if [[ -z "${AFTER:-}" ]]; then
            echo "Cannot resolve AFTER commit SHA."
            exit 1
          fi

          # Prefer the last successful sync point saved in R2. This allows
          # automatic catch-up when previous sync runs failed.
          BEFORE=""
          if aws s3 cp "s3://${R2_BUCKET}/${STATE_KEY}" "$STATE_FILE" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            LAST_SYNCED_SHA="$(tr -d '\r\n' < "$STATE_FILE")"
            if [[ -n "$LAST_SYNCED_SHA" ]] && git cat-file -e "${LAST_SYNCED_SHA}^{commit}" 2>/dev/null; then
              if git merge-base --is-ancestor "$LAST_SYNCED_SHA" "$AFTER" 2>/dev/null; then
                BEFORE="$LAST_SYNCED_SHA"
                echo "Using last successful synced SHA from R2: $BEFORE"
              else
                echo "Last synced SHA is not an ancestor of target commit, will fallback."
              fi
            else
              echo "Invalid last synced SHA state, will fallback."
            fi
          else
            echo "No sync state found in R2, will fallback."
          fi

          if [[ -z "${BEFORE:-}" ]]; then
            echo "No valid last_synced_sha in R2; fallback to full upload."
            sync_live2d_prefix
            sync_root_directories
            printf '%s\n' "$AFTER" > "$STATE_FILE"
            aws s3 cp "$STATE_FILE" "s3://${R2_BUCKET}/${STATE_KEY}" --endpoint-url "$R2_ENDPOINT"
            exit 0
          fi

          echo "Diff range: ${BEFORE}..${AFTER}"
          change_count=0

          while IFS= read -r -d '' status; do
            change_count=$((change_count + 1))
            path1=""
            path2=""

            if [[ "$status" == R* ]]; then
              IFS= read -r -d '' path1
              IFS= read -r -d '' path2
            else
              IFS= read -r -d '' path1
            fi

            case "$status" in
              D)
                if should_sync_path "$path1"; then
                  target_key="$(s3_key_for_path "$path1")"
                  echo "Delete: $path1 -> $target_key"
                  aws s3 rm "s3://${R2_BUCKET}/${target_key}" --endpoint-url "$R2_ENDPOINT"
                fi
                ;;
              R*)
                if should_sync_path "$path1"; then
                  target_key="$(s3_key_for_path "$path1")"
                  echo "Delete(renamed): $path1 -> $target_key"
                  aws s3 rm "s3://${R2_BUCKET}/${target_key}" --endpoint-url "$R2_ENDPOINT"
                fi
                if should_sync_path "$path2"; then
                  target_key="$(s3_key_for_path "$path2")"
                  echo "Upload(renamed): $path2 -> $target_key"
                  aws s3 cp "$path2" "s3://${R2_BUCKET}/${target_key}" --endpoint-url "$R2_ENDPOINT"
                fi
                ;;
              *)
                if should_sync_path "$path1"; then
                  target_key="$(s3_key_for_path "$path1")"
                  echo "Upload: $path1 -> $target_key"
                  aws s3 cp "$path1" "s3://${R2_BUCKET}/${target_key}" --endpoint-url "$R2_ENDPOINT"
                fi
                ;;
            esac
          done < <(git -c core.quotePath=false diff --name-status --find-renames -z "$BEFORE" "$AFTER")

          if [[ "$change_count" -eq 0 ]]; then
            echo "No changed files, skipping upload."
            printf '%s\n' "$AFTER" > "$STATE_FILE"
            aws s3 cp "$STATE_FILE" "s3://${R2_BUCKET}/${STATE_KEY}" --endpoint-url "$R2_ENDPOINT"
            exit 0
          fi

          printf '%s\n' "$AFTER" > "$STATE_FILE"
          aws s3 cp "$STATE_FILE" "s3://${R2_BUCKET}/${STATE_KEY}" --endpoint-url "$R2_ENDPOINT"
          echo "Updated sync state to $AFTER"
